# Data Splits Configuration
# Defines subject-level train/val/test splits
# Subjects are identified by their numeric ID (e.g., sub-01 → 1, sub-02 → 2)

# For 31 subjects: 20 train (64.5%), 6 val (19.4%), 5 test (16.1%)
# Training split designed for 4 GPUs: 5 subjects per GPU for perfect load balancing
train:
  - 1   # sub-01  [GPU 0]
  - 2   # sub-02  [GPU 0]
  - 3   # sub-03  [GPU 0]
  - 4   # sub-04  [GPU 0]
  - 5   # sub-05  [GPU 0]
  - 6   # sub-06  [GPU 1]
  - 7   # sub-07  [GPU 1]
  - 8   # sub-08  [GPU 1]
  - 9   # sub-09  [GPU 1]
  - 10  # sub-10  [GPU 1]
  - 11  # sub-11  [GPU 2]
  - 12  # sub-12  [GPU 2]
  - 13  # sub-13  [GPU 2]
  - 14  # sub-14  [GPU 2]
  - 15  # sub-15  [GPU 2]
  - 16  # sub-16  [GPU 3]
  - 17  # sub-17  [GPU 3]
  - 18  # sub-18  [GPU 3]
  - 19  # sub-19  [GPU 3]
  - 20  # sub-20  [GPU 3]

validation:
  - 21  # sub-21
  - 22  # sub-22
  - 23  # sub-23
  - 24  # sub-24
  - 25  # sub-25
  - 26  # sub-26

test:
  - 27  # sub-27
  - 28  # sub-28
  - 29  # sub-29
  - 30  # sub-30
  - 31  # sub-31

# Note: If you have fewer subjects, the system will automatically
# filter to only available subjects. Missing subjects are skipped gracefully.

