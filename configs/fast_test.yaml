# Fast test configuration - uses first 10 seconds of data only
data:
  data_path: "data/raw/sub-01_task-resting_eeg.set"
  raw_data_path: "data/raw"
  batch_size: 4
  num_workers: 0
  segment_length: 1000
  overlap: 0.0
  sampling_rate: 1000.0
  channels: 128
  original_channels: 129
  channel_selection_strategy: "uniform_spatial"
  preprocess: false
  augment: false
  max_duration: 10.0

model:
  n_channels: 128
  n_neurons: 128
  n_layers: 2
  hidden_dim: 32
  graph_type: "functional"
  connectivity_threshold: 0.1
  dropout: 0.1
  lif_params:
    tau_m: 20.0
    v_rest: -65.0
    v_threshold: -55.0
    v_reset: -65.0
    refractory_period: 2.0
  synapse_params:
    tau_s: 5.0
    weight_scale: 1.0
    plasticity: true
  readout_params:
    readout_type: "linear"
    activation: "tanh"

training:
  epochs: 1
  learning_rate: 0.001
  batch_size: 4
  output_dir: "outputs/"
  save_frequency: 100
  log_frequency: 1
  early_stopping_patience: 5
  gradient_clip: 1.0

loss:
  eeg_weight: 1.0
  spiking_weight: 0.1
  biological_weight: 0.01
  regularization_weight: 0.001

optimizer:
  type: "adam"
  learning_rate: 0.001
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8

scheduler:
  type: "reduce_lr_on_plateau"
  params:
    mode: "min"
    factor: 0.5
    patience: 3
    min_lr: 1e-6

checkpointing:
  save_dir: "checkpoints/"
  save_frequency: 100
  max_checkpoints: 3

logging:
  level: "INFO"
  log_frequency: 1
  tensorboard: true
  wandb: false
