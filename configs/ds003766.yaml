# NGIS Configuration for ds003766 Dataset
# OpenNeuro dataset: https://openneuro.org/datasets/ds003766

# Data configuration
data:
  data_path: "data/raw/sub-01_task-resting_eeg.set"  # Path to specific EEG file
  raw_data_path: "data/raw"
  batch_size: 2  # Small batch size for testing
  num_workers: 2  # Reduced workers for single subject
  segment_length: 1000  # 1 second segments (1000 samples @ 1000 Hz)
  overlap: 0.0  # No overlap for now
  sampling_rate: 1000.0  # Dataset sampling rate
  channels: 128  # Target channel count (ds003766 has 129, will drop 1)
  original_channels: 129  # Actual channels in dataset
  channel_selection_strategy: "uniform_spatial"  # Use uniform spatial selection
  preprocess: true
  augment: false  # Disable augmentation for initial testing
  validation_split: 0.1  # Only use 10% for validation (faster)

# Model configuration
model:
  n_channels: 128
  n_neurons: 256
  n_layers: 3
  hidden_dim: 64
  graph_type: "functional"
  connectivity_threshold: 0.1
  dropout: 0.1
  lif_params:
    tau_m: 20.0
    v_rest: -65.0
    v_threshold: -55.0
    v_reset: -65.0
    refractory_period: 2.0
  synapse_params:
    tau_s: 5.0
    weight_scale: 1.0
    plasticity: true
  readout_params:
    readout_type: "linear"
    activation: "tanh"

# Training configuration
training:
  epochs: 10  # Reduced for testing
  learning_rate: 0.001
  batch_size: 2  # Small batch for testing
  output_dir: "outputs/"
  save_frequency: 1  # Save every epoch
  log_frequency: 10  # Log more frequently
  validation_frequency: 1  # Validate every epoch
  early_stopping_patience: 5
  gradient_clip: 1.0

# Loss function configuration
loss:
  eeg_weight: 1.0
  spiking_weight: 0.1
  biological_weight: 0.01
  regularization_weight: 0.001

# Optimizer configuration
optimizer:
  type: "adam"
  learning_rate: 0.001
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8

# Scheduler configuration
scheduler:
  type: "reduce_lr_on_plateau"
  params:
    mode: "min"
    factor: 0.5
    patience: 3
    min_lr: 1e-6

# Checkpointing configuration
checkpointing:
  save_dir: "checkpoints/"
  save_frequency: 5
  max_checkpoints: 3

# Logging configuration
logging:
  level: "DEBUG"
  log_frequency: 1
  tensorboard: true
  wandb: false
  wandb_project: "ngis-ds003766"
